<!-- MINI JUEGO: ARMA TU PRIMER ROBOT -->
<section class="robo-game">

  <h2 class="robo-game-title">
    Arma tu primer robot 🤖
  </h2>

  <p class="robo-game-subtitle">
    Así aprenden los niños en RoboWorks: jugando y creando
  </p>

  <div class="robo-game-area">

    <!-- ROBOT BASE -->
    <div class="robot-base">
      <div class="drop-zone" data-piece="head">Cabeza</div>
      <div class="drop-zone" data-piece="sensor">Sensor</div>
      <div class="drop-zone" data-piece="motor">Motor</div>
      <div class="drop-zone" data-piece="wheels">Ruedas</div>
    </div>

    <!-- PIEZAS -->
    <div class="robot-pieces">
      <div class="piece" data-piece="head">🤖</div>
      <div class="piece" data-piece="sensor">📡</div>
      <div class="piece" data-piece="motor">⚙️</div>
      <div class="piece" data-piece="wheels">🛞</div>
    </div>

  </div>

  <!-- MENSAJE FINAL -->
  <div class="game-finish hidden" id="game-finish">
    <h3>¡Felicidades! Acabas de crear tu primer robot 🤖</h3>
    <p>Así aprenden los niños en RoboWorks: jugando y creando.</p>

    <a href="https://wa.me/593XXXXXXXXX" class="game-cta">
      Quiero que mi hijo viva esta experiencia
    </a>
  </div>

</section>
