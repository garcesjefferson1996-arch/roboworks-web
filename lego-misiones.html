<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoboWorks Building Series | Misiones LEGO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<style>
/* ═══════════════════════════════════════════════════════
   BASE
═══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow-x: hidden; }
body {
  font-family: 'Poppins', sans-serif;
  background: #0a0e1a;
  color: #fff;
  -webkit-font-smoothing: antialiased;
}
a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }

/* ═══════════════════════════════════════════════════════
   VARIABLES
═══════════════════════════════════════════════════════ */
:root {
  --y:  #ffd700;   /* LEGO yellow  */
  --r:  #e3000b;   /* LEGO red     */
  --b:  #006db7;   /* LEGO blue    */
  --g:  #00a650;   /* LEGO green   */
  --cy: #00c8ff;   /* cyan glow    */
  --dk: #0a0e1a;   /* dark bg      */
  --d2: #131929;   /* card bg      */
}

/* ═══════════════════════════════════════════════════════
   STARS BACKGROUND
═══════════════════════════════════════════════════════ */
.stars-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  overflow: hidden;
}
.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
}
@keyframes twinkle {
  0%,100% { opacity: .15; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.4); }
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-14px); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes pulseGlow {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,215,0,.5), 0 8px 32px rgba(255,215,0,.3); }
  50%      { box-shadow: 0 0 0 16px rgba(255,215,0,.0), 0 8px 48px rgba(255,215,0,.6); }
}
@keyframes spinSlow {
  to { transform: rotate(360deg); }
}
@keyframes popIn {
  0%   { transform: scale(0) rotate(-10deg); opacity: 0; }
  70%  { transform: scale(1.12) rotate(3deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes pathDraw {
  from { stroke-dashoffset: 1000; }
  to   { stroke-dashoffset: 0; }
}
@keyframes starBurst {
  0%   { transform: translate(0,0) scale(0); opacity: 1; }
  100% { transform: translate(var(--tx),var(--ty)) scale(1); opacity: 0; }
}

/* ═══════════════════════════════════════════════════════
   SCREENS (game states)
═══════════════════════════════════════════════════════ */
.screen {
  display: none;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}
.screen.active { display: flex; flex-direction: column; }

/* ═══════════════════════════════════════════════════════
   MINIMAL NAV
═══════════════════════════════════════════════════════ */
.game-nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px;
  background: rgba(10,14,26,.8);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.game-nav__brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 900; font-size: 1.1rem;
}
.game-nav__brand .r { color: var(--cy); }
.game-nav__brand .w { color: var(--y); }
.game-nav__back {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  color: rgba(255,255,255,.7);
  font-size: .82rem; font-weight: 700;
  padding: 7px 16px; border-radius: 99px;
  cursor: pointer; transition: all .2s;
}
.game-nav__back:hover { background: rgba(255,255,255,.14); color: #fff; }

/* ═══════════════════════════════════════════════════════
   SCREEN 1 — TITLE
═══════════════════════════════════════════════════════ */
#s-title {
  align-items: center; justify-content: center;
  text-align: center;
  padding: 100px 24px 60px;
  gap: 0;
}

.title-logo {
  width: clamp(200px, 36vw, 360px);
  margin: 0 auto 24px;
  animation: fadeInUp .7s ease both;
  filter: drop-shadow(0 12px 40px rgba(0,200,255,.3));
}
/* Fallback cuando no hay imagen */
.title-logo-fallback {
  display: none;
  flex-direction: column; align-items: center; gap: 6px;
  margin-bottom: 24px; animation: fadeInUp .7s ease both;
}
.title-logo-fallback .t1 {
  font-size: clamp(2.4rem, 7vw, 5rem);
  font-weight: 900; line-height: 1;
  color: var(--cy);
  text-shadow: 0 0 40px rgba(0,200,255,.5);
}
.title-logo-fallback .t2 {
  font-size: clamp(2rem, 6vw, 4rem);
  font-weight: 900; line-height: 1; color: var(--y);
  text-shadow: 0 0 30px rgba(255,215,0,.5);
}
.title-logo-fallback .t3 {
  font-size: clamp(.85rem, 2vw, 1.2rem);
  font-weight: 800; letter-spacing: .25em;
  color: rgba(255,255,255,.5); text-transform: uppercase;
  margin-top: 4px;
}

/* Worky hero */
.title-worky {
  width: clamp(160px, 28vw, 280px);
  margin: 0 auto 8px;
  animation: float 3.5s ease-in-out infinite, fadeInUp .9s ease .15s both;
  filter: drop-shadow(0 20px 50px rgba(0,200,255,.25));
}
.title-worky-fallback {
  display: none;
  font-size: clamp(5rem, 14vw, 10rem);
  margin-bottom: 8px;
  animation: float 3.5s ease-in-out infinite, fadeInUp .9s ease .15s both;
  line-height: 1;
}

.title-tagline {
  font-size: clamp(.9rem, 2.2vw, 1.25rem);
  color: rgba(255,255,255,.6);
  margin-bottom: 40px;
  animation: fadeInUp .9s ease .3s both;
}
.title-tagline span { color: var(--y); font-weight: 800; }

.btn-play {
  display: inline-flex; align-items: center; gap: 14px;
  background: var(--y);
  color: #0a0e1a;
  font-family: 'Poppins', sans-serif;
  font-weight: 900;
  font-size: clamp(1.1rem, 3vw, 1.5rem);
  padding: 18px 52px;
  border-radius: 99px;
  border: none; cursor: pointer;
  animation: pulseGlow 2s ease-in-out infinite, fadeInUp .9s ease .45s both;
  transition: transform .15s;
  letter-spacing: .02em;
}
.btn-play:hover { transform: scale(1.06); }
.btn-play:active { transform: scale(.97); }
.btn-play i { font-size: 1.3em; }

.title-missions-preview {
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  margin-top: 48px;
  animation: fadeInUp .9s ease .6s both;
}
.preview-dot {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: .85rem;
  border: 2px solid rgba(255,255,255,.15);
  color: rgba(255,255,255,.35);
  background: rgba(255,255,255,.04);
  transition: all .2s;
}
.preview-dot.done   { background: var(--g); border-color: var(--g); color: #fff; }
.preview-dot.active { background: var(--y); border-color: var(--y); color: #0a0e1a; box-shadow: 0 0 0 6px rgba(255,215,0,.2); }

/* ═══════════════════════════════════════════════════════
   SCREEN 2 — WORLD MAP
═══════════════════════════════════════════════════════ */
#s-map {
  padding: 88px 24px 60px;
  align-items: center;
}

.map-header {
  text-align: center; margin-bottom: 48px;
  animation: fadeInUp .5s ease both;
}
.map-header h2 {
  font-size: clamp(1.6rem, 4vw, 2.6rem);
  font-weight: 900;
  color: var(--y);
  text-shadow: 0 0 30px rgba(255,215,0,.35);
  margin-bottom: 6px;
}
.map-header p { color: rgba(255,255,255,.5); font-size: .95rem; }

/* Mission path */
.mission-path {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  width: 100%;
  max-width: 560px;
  position: relative;
}

.path-row {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  position: relative;
}
.path-row.right { justify-content: flex-end; padding-right: 80px; }
.path-row.left  { justify-content: flex-start; padding-left: 80px; }
.path-row.center { justify-content: center; }

/* Connector line between nodes */
.path-connector {
  width: 3px;
  height: 56px;
  margin: 0 auto;
  position: relative;
}
.path-connector::after {
  content: '';
  position: absolute;
  left: 50%; top: 0;
  transform: translateX(-50%);
  width: 3px; height: 100%;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.25) 0px,
    rgba(255,255,255,.25) 8px,
    transparent 8px,
    transparent 16px
  );
  border-radius: 99px;
}
.path-connector.done::after {
  background: linear-gradient(to bottom, var(--g), var(--cy));
  box-shadow: 0 0 10px rgba(0,200,255,.3);
}

/* Mission node */
.mission-node {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer;
  animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
}
.mission-node:nth-child(1) { animation-delay: .1s; }
.mission-node:nth-child(2) { animation-delay: .2s; }
.mission-node:nth-child(3) { animation-delay: .3s; }
.mission-node:nth-child(4) { animation-delay: .4s; }
.mission-node:nth-child(5) { animation-delay: .5s; }

.node-bubble {
  width: 90px; height: 90px;
  border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-weight: 900;
  position: relative;
  transition: transform .2s;
  border: 4px solid rgba(255,255,255,.1);
  background: var(--d2);
}
.mission-node:not(.locked):hover .node-bubble { transform: scale(1.12); }
.mission-node.active .node-bubble {
  background: linear-gradient(135deg, var(--y), #ffaa00);
  border-color: var(--y);
  box-shadow: 0 0 0 8px rgba(255,215,0,.2), 0 12px 32px rgba(255,215,0,.4);
  animation: pulseGlow 2s ease-in-out infinite;
  color: #0a0e1a;
}
.mission-node.done .node-bubble {
  background: linear-gradient(135deg, var(--g), #00cc60);
  border-color: var(--g);
  box-shadow: 0 0 20px rgba(0,166,80,.4);
  color: #fff;
}
.mission-node.locked .node-bubble {
  opacity: .4; cursor: default;
  filter: grayscale(.5);
}
.node-num {
  font-size: 1.5rem; line-height: 1;
  font-weight: 900;
}
.node-icon {
  font-size: .75rem; opacity: .8;
}

/* Stars under node */
.node-stars {
  display: flex; gap: 4px;
}
.node-stars i {
  font-size: .65rem;
  color: rgba(255,255,255,.2);
}
.node-stars i.lit { color: var(--y); text-shadow: 0 0 8px var(--y); }

.node-label {
  font-size: .72rem; font-weight: 700;
  text-align: center;
  color: rgba(255,255,255,.6);
  max-width: 100px;
  line-height: 1.3;
}
.mission-node.active .node-label { color: var(--y); }
.mission-node.done   .node-label { color: var(--g); }

/* Lock badge */
.node-lock {
  position: absolute; top: -4px; right: -4px;
  width: 26px; height: 26px; border-radius: 50%;
  background: #333; border: 2px solid #555;
  display: flex; align-items: center; justify-content: center;
  font-size: .65rem; color: #888;
}

/* ═══════════════════════════════════════════════════════
   SCREEN 3 — MISSION DETAIL
═══════════════════════════════════════════════════════ */
#s-mission {
  padding: 80px 0 60px;
}
.mission-wrap {
  width: min(920px, calc(100% - 32px));
  margin: 0 auto;
  animation: fadeInUp .4s ease both;
}

/* Mission header */
.ms-header {
  display: flex; align-items: flex-start; gap: 20px;
  background: linear-gradient(135deg, #131929, #1a2540);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 24px 24px 0 0;
  padding: 28px 32px;
  position: relative; overflow: hidden;
}
.ms-header::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--r), var(--y), var(--b));
}
.ms-num-badge {
  min-width: 64px; height: 64px;
  background: var(--y); color: #0a0e1a;
  border-radius: 16px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-weight: 900; line-height: 1;
  flex-shrink: 0;
}
.ms-num-badge .big { font-size: 1.6rem; }
.ms-num-badge .small { font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.ms-title-area { flex: 1; }
.ms-title-area h1 {
  font-size: clamp(1.3rem, 3.5vw, 2rem);
  font-weight: 900; color: #fff; margin-bottom: 10px; line-height: 1.1;
}
.ms-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: 99px;
  font-size: .75rem; font-weight: 700;
}
.chip-y  { background: rgba(255,215,0,.12); color: var(--y); border: 1px solid rgba(255,215,0,.25); }
.chip-cy { background: rgba(0,200,255,.10); color: var(--cy); border: 1px solid rgba(0,200,255,.2); }
.chip-or { background: rgba(255,120,0,.10); color: #ff9040; border: 1px solid rgba(255,120,0,.2); }

/* Mission body: video + sidebar */
.ms-body {
  display: grid;
  grid-template-columns: 1fr 300px;
  border: 1px solid rgba(255,255,255,.08);
  border-top: none;
  border-radius: 0 0 24px 24px;
  overflow: hidden;
  background: #0e1525;
}
.ms-main { padding: 28px; border-right: 1px solid rgba(255,255,255,.06); }
.ms-side  { padding: 24px; background: #101626; }

/* YouTube */
.yt-wrap {
  position: relative; width: 100%;
  padding-bottom: 56.25%;
  border-radius: 16px; overflow: hidden;
  margin-bottom: 24px; cursor: pointer;
  background: #060b14;
}
.yt-wrap iframe,
.yt-thumb { position: absolute; inset: 0; width: 100%; height: 100%; }
.yt-thumb { object-fit: cover; border-radius: 16px; }
.yt-overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
  background: rgba(6,11,20,.55);
  border-radius: 16px;
  transition: background .2s;
}
.yt-wrap:hover .yt-overlay { background: rgba(6,11,20,.4); }
.yt-play {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--r);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; color: #fff;
  box-shadow: 0 0 0 14px rgba(227,0,11,.15);
  transition: transform .2s, box-shadow .2s;
}
.yt-wrap:hover .yt-play {
  transform: scale(1.1);
  box-shadow: 0 0 0 20px rgba(227,0,11,.10);
}
.yt-overlay strong { color: #fff; font-size: 1rem; }
.yt-overlay span { color: rgba(255,255,255,.55); font-size: .8rem; }

/* Objetivo */
.ms-obj h3 {
  font-size: .85rem; font-weight: 800;
  letter-spacing: .07em; text-transform: uppercase;
  color: var(--cy); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.ms-obj p { color: rgba(255,255,255,.7); font-size: .93rem; line-height: 1.7; }

/* Sidebar sections */
.side-sec { margin-bottom: 24px; }
.side-sec h4 {
  font-size: .72rem; font-weight: 800;
  letter-spacing: .09em; text-transform: uppercase;
  color: rgba(255,255,255,.35);
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 7px;
}

/* Pieces */
.pieces { display: flex; flex-direction: column; gap: 8px; }
.piece {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 12px; padding: 10px 12px;
}
.piece-color {
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
  border: 2px solid rgba(255,255,255,.15);
}
.piece-info { flex: 1; }
.piece-info strong { display: block; font-size: .83rem; color: #fff; }
.piece-info span { font-size: .72rem; color: rgba(255,255,255,.4); }
.piece-qty {
  background: rgba(255,215,0,.12); color: var(--y);
  font-weight: 900; font-size: .85rem;
  padding: 4px 10px; border-radius: 8px;
}

/* Steps */
.steps { display: flex; flex-direction: column; gap: 8px; }
.step {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: .83rem; color: rgba(255,255,255,.65); line-height: 1.5;
}
.step-n {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--b); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: .65rem; font-weight: 800; flex-shrink: 0; margin-top: 1px;
}

/* Complete button */
.btn-complete {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--g), #00cc60);
  color: #fff; font-family: 'Poppins', sans-serif;
  font-weight: 900; font-size: 1rem;
  border: none; border-radius: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 8px 28px rgba(0,166,80,.35);
  transition: transform .2s, box-shadow .2s;
  position: relative; overflow: hidden;
}
.btn-complete::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
  transform: translateX(-100%);
  transition: transform .5s;
}
.btn-complete:hover:not(:disabled)::after { transform: translateX(100%); }
.btn-complete:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(0,166,80,.45); }
.btn-complete:disabled {
  background: linear-gradient(135deg, #1a3d2e, #1f4d38);
  color: var(--g); cursor: default;
  box-shadow: none;
}

/* Worky toast */
.worky-toast {
  display: none; margin-top: 14px;
  align-items: center; gap: 12px;
  background: rgba(0,166,80,.12);
  border: 1px solid rgba(0,166,80,.3);
  border-radius: 14px; padding: 14px;
  animation: fadeInUp .4s ease both;
}
.worky-toast.show { display: flex; }
.worky-toast img { width: 44px; height: 44px; object-fit: contain; }
.worky-toast-txt strong { display: block; color: var(--g); font-size: .82rem; font-weight: 800; }
.worky-toast-txt p { color: rgba(255,255,255,.65); font-size: .8rem; margin: 0; line-height: 1.5; }

/* Navigation between missions */
.ms-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 24px; gap: 12px;
}
.ms-nav-btn {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.10);
  color: rgba(255,255,255,.7);
  font-family: 'Poppins', sans-serif;
  font-weight: 700; font-size: .88rem;
  padding: 12px 20px; border-radius: 12px;
  cursor: pointer; transition: all .2s;
}
.ms-nav-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
.ms-nav-btn.next {
  background: linear-gradient(135deg, var(--b), #0055a0);
  border-color: transparent; color: #fff;
  box-shadow: 0 6px 20px rgba(0,109,183,.35);
}
.ms-nav-btn.next:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,109,183,.5); }
.ms-nav-btn:disabled { opacity: .3; cursor: default; pointer-events: none; }

/* ═══════════════════════════════════════════════════════
   PARTICLE BURST
═══════════════════════════════════════════════════════ */
.burst { position: fixed; pointer-events: none; z-index: 9999; }
.burst-p {
  position: absolute;
  width: 10px; height: 10px;
  border-radius: 50%;
  animation: starBurst .9s ease-out forwards;
}

/* ═══════════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════════ */
@media (max-width: 700px) {
  .ms-body { grid-template-columns: 1fr; }
  .ms-main { border-right: none; border-bottom: 1px solid rgba(255,255,255,.06); padding: 20px; }
  .ms-side { padding: 20px; }
  .ms-header { padding: 20px; gap: 14px; }
  .path-row.right { padding-right: 30px; }
  .path-row.left  { padding-left: 30px; }
  .node-bubble { width: 76px; height: 76px; }
}
@media (max-width: 420px) {
  .btn-play { padding: 16px 36px; font-size: 1.1rem; }
  .node-bubble { width: 66px; height: 66px; }
  .node-num { font-size: 1.2rem; }
}
</style>
</head>
<body>

<!-- ═══════════════ STARS ═══════════════ -->
<div class="stars-bg" id="starsBg"></div>

<!-- ═══════════════ NAV ═══════════════ -->
<nav class="game-nav">
  <a href="index.html" class="game-nav__brand">
    <img src="assets/icons/logo.png" alt="RoboWorks" style="width:32px;height:32px;object-fit:contain" onerror="this.style.display='none'">
    <span><span class="r">Robo</span><span class="w">Works</span></span>
  </a>
  <button class="game-nav__back" id="navBack" onclick="goBack()" style="display:none">
    <i class="fas fa-arrow-left"></i> Volver

</nav>


<!-- ═══════════════════════════════════════════════════════
     PANTALLA 1 — TÍTULO
═══════════════════════════════════════════════════════ -->
<div class="screen active" id="s-title">

  <!-- Logo Building Series -->
  <img
    src="images/lego/building-series-logo.png"
    alt="RoboWorks Building Series"
    class="title-logo"
    id="titleLogo"
    onerror="this.style.display='none';document.getElementById('titleLogoFb').style.display='flex'"
  />
  <div class="title-logo-fallback" id="titleLogoFb">
    <div class="t1">ROBO<span style="color:var(--y)">WORKS</span></div>
    <div class="t2">BUILDING</div>
    <div class="t3">Series</div>
  </div>

  <!-- Worky -->
  <img
    src="images/lego/worky-hero.png"
    alt="Worky"
    class="title-worky"
    onerror="this.style.display='none';document.getElementById('workyFb').style.display='block'"
  />
  <div class="title-worky-fallback" id="workyFb">
    <i class="fas fa-robot" style="color:var(--cy);font-size:clamp(4rem,12vw,8rem);filter:drop-shadow(0 0 30px rgba(0,200,255,.5))"></i>
  </div>

  <p class="title-tagline">Construye. Aprende. <span>¡Conquista el planeta!</span></p>

  <button class="btn-play" onclick="goTo('s-map')">
    <i class="fas fa-play"></i> ¡JUGAR!
  </button>

  <!-- Mini progress dots -->
  <div class="title-missions-preview" id="titleDots"></div>

</div>


<!-- ═══════════════════════════════════════════════════════
     PANTALLA 2 — MAPA DE MISIONES
═══════════════════════════════════════════════════════ -->
<div class="screen" id="s-map">

  <div class="map-header">
    <h2><i class="fas fa-map" style="margin-right:10px"></i>Mapa de Misiones</h2>
    <p>Selecciona una misión para comenzar tu aventura</p>
  </div>

  <div class="mission-path" id="missionPath">
    <!-- Generado por JS -->
  </div>

</div>


<!-- ═══════════════════════════════════════════════════════
     PANTALLA 3 — DETALLE DE MISIÓN
═══════════════════════════════════════════════════════ -->
<div class="screen" id="s-mission">
  <div class="mission-wrap" id="missionContent">
    <!-- Generado por JS -->
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════════════════════════ -->
<script>
/* ── Datos de misiones ──────────────────────────────── */
const MISSIONS = [
  {
    id: 1,
    title: 'El Cuadrado de Dos Pisos',
    level: '01',
    diff: 'Principiante',
    age: '5 – 8 años',
    time: '30 min',
    videoId: 'bFRcz1C1E4k',
    objective: 'Construye una estructura cuadrada de dos pisos usando 16 bloques 1×4. Aprenderás a distribuir las piezas en capas, dar estabilidad y entender cómo las estructuras crecen hacia arriba.',
    pieces: [
      { color: '#e3000b', name: 'Bloque 1×4', sub: 'Cualquier color · LEGO Classic', qty: '×16' }
    ],
    steps: [
      'Toma 8 bloques 1×4 para construir el primer piso.',
      'Colócalos formando un cuadrado cerrado (2 en cada lado).',
      'Toma los otros 8 bloques y repite el cuadrado encima.',
      'Verifica que los bordes estén alineados en los dos pisos.',
      'Muéstrale tu construcción al profe para registrar el logro.'
    ],
    toast: '¡Levantaste tu primera estructura de dos pisos. Sigue construyendo el futuro!',
    locked: false
  },
  {
    id: 2,
    title: 'El Gran Triángulo',
    level: '02',
    diff: 'Explorador',
    age: '6 – 9 años',
    time: '35 min',
    videoId: 'vapHXE7GrfI',
    objective: 'Construye un triángulo usando bloques de diferentes tamaños. Aprenderás a combinar piezas de distintas longitudes para formar figuras geométricas con ángulos y lados definidos.',
    pieces: [
      { color: '#e3000b', name: 'Bloque 1×1', sub: 'Cualquier color · LEGO Classic', qty: '×14' },
      { color: '#006db7', name: 'Bloque 1×2', sub: 'Cualquier color · LEGO Classic', qty: '×2' },
      { color: '#ffd700', name: 'Bloque 1×3', sub: 'Cualquier color · LEGO Classic', qty: '×2' },
      { color: '#00a650', name: 'Bloque 1×4', sub: 'Cualquier color · LEGO Classic', qty: '×3' }
    ],
    steps: [
      'Observa el video completo antes de empezar.',
      'Construye la base del triángulo con los bloques 1×4.',
      'Sube los lados usando bloques 1×3 y 1×2.',
      'Cierra la punta del triángulo con los bloques 1×1.',
      'Verifica que la figura tenga forma de triángulo y muéstrasela al profe.'
    ],
    toast: '¡Construiste tu primer triángulo! Ya dominas las figuras geométricas con LEGO.',
    locked: true
  },
  {
    id: 3,
    title: 'El Árbol Mecánico',
    level: '03',
    diff: 'Explorador',
    age: '6 – 9 años',
    time: '40 min',
    videoId: null,
    objective: 'Diseña un árbol con raíces, tronco y ramas diferenciadas.',
    pieces: [],
    steps: [],
    toast: '',
    locked: true
  },
  {
    id: 4,
    title: 'Casa para Worky',
    level: '04',
    diff: 'Constructor',
    age: '7 – 10 años',
    time: '45 min',
    videoId: null,
    objective: 'Construye una casa con puertas, ventanas y techo de dos aguas.',
    pieces: [],
    steps: [],
    toast: '',
    locked: true
  },
  {
    id: 5,
    title: 'Nave Exploradora',
    level: '05',
    diff: 'Maestro',
    age: '8 – 12 años',
    time: '60 min',
    videoId: null,
    objective: 'El gran reto final. Diseña la nave que llevará a Worky al espacio.',
    pieces: [],
    steps: [],
    toast: '',
    locked: true
  }
];

/* ── Estado ─────────────────────────────────────────── */
let completed = JSON.parse(localStorage.getItem('bs_completed') || '[]');
let currentScreen = 's-title';
let currentMission = null;
const screenStack = [];

/* ── Navegación ─────────────────────────────────────── */
function goTo(screenId, missionId) {
  document.getElementById(currentScreen).classList.remove('active');
  screenStack.push(currentScreen);
  currentScreen = screenId;
  const el = document.getElementById(screenId);
  el.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  document.getElementById('navBack').style.display =
    screenStack.length ? 'flex' : 'none';

  if (screenId === 's-map')   buildMap();
  if (screenId === 's-mission' && missionId) buildMission(missionId);
}

function goBack() {
  if (!screenStack.length) return;
  document.getElementById(currentScreen).classList.remove('active');
  currentScreen = screenStack.pop();
  document.getElementById(currentScreen).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('navBack').style.display =
    screenStack.length ? 'flex' : 'none';
  if (currentScreen === 's-map') buildMap();
}

/* ── Build title dots ───────────────────────────────── */
function buildTitleDots() {
  const wrap = document.getElementById('titleDots');
  wrap.innerHTML = '';
  MISSIONS.forEach((m, i) => {
    const d = document.createElement('div');
    d.className = 'preview-dot';
    d.textContent = i + 1;
    if (completed.includes(m.id)) d.classList.add('done');
    else if (!m.locked && !completed.includes(m.id)) d.classList.add('active');
    wrap.appendChild(d);
  });
}

/* ── Build map ──────────────────────────────────────── */
function buildMap() {
  const path = document.getElementById('missionPath');
  path.innerHTML = '';

  const alignments = ['center','right','center','left','center'];

  MISSIONS.forEach((m, i) => {
    const isDone   = completed.includes(m.id);
    const isLocked = m.locked && !isDone;
    // Unlock next if previous done
    const prevDone = i === 0 || completed.includes(MISSIONS[i-1].id);
    const isActive = !isDone && !m.locked && prevDone || (i === 0 && !isDone);

    // Connector (not before first)
    if (i > 0) {
      const conn = document.createElement('div');
      conn.className = 'path-connector' + (completed.includes(MISSIONS[i-1].id) ? ' done' : '');
      path.appendChild(conn);
    }

    const row = document.createElement('div');
    row.className = `path-row ${alignments[i]}`;

    const node = document.createElement('div');
    node.className = 'mission-node' +
      (isDone   ? ' done'   : '') +
      (isActive ? ' active' : '') +
      (isLocked && !prevDone ? ' locked' : '');
    node.style.animationDelay = (i * .12) + 's';

    if (!isLocked || prevDone) {
      node.onclick = () => {
        if (isDone || isActive || prevDone) goTo('s-mission', m.id);
      };
    }

    const icons = ['fa-cubes','fa-play','fa-tree','fa-house','fa-rocket'];

    node.innerHTML = `
      <div class="node-bubble">
        ${isLocked && !prevDone
          ? `<i class="fas fa-lock" style="font-size:1.4rem;opacity:.6"></i>`
          : `<div class="node-num">${m.level}</div>
             <div class="node-icon"><i class="fas ${icons[i]}"></i></div>`
        }
        ${isLocked && !prevDone ? '<div class="node-lock"><i class="fas fa-lock"></i></div>' : ''}
      </div>
      <div class="node-stars">
        <i class="fas fa-star ${isDone ? 'lit' : ''}"></i>
        <i class="fas fa-star ${isDone ? 'lit' : ''}"></i>
        <i class="fas fa-star ${isDone ? 'lit' : ''}"></i>
      </div>
      <div class="node-label">${m.title}</div>
    `;

    row.appendChild(node);
    path.appendChild(row);
  });
}

/* ── Build mission detail ───────────────────────────── */
function buildMission(id) {
  const m = MISSIONS.find(x => x.id === id);
  currentMission = id;
  const isDone = completed.includes(id);
  const wrap = document.getElementById('missionContent');

  const piecesHtml = m.pieces.map(p => `
    <div class="piece">
      <div class="piece-color" style="background:${p.color}"></div>
      <div class="piece-info">
        <strong>${p.name}</strong>
        <span>${p.sub}</span>
      </div>
      <div class="piece-qty">${p.qty}</div>
    </div>
  `).join('') || '<p style="color:rgba(255,255,255,.3);font-size:.82rem">Próximamente</p>';

  const stepsHtml = m.steps.map((s, i) => `
    <div class="step">
      <div class="step-n">${i+1}</div>
      <span>${s}</span>
    </div>
  `).join('') || '<p style="color:rgba(255,255,255,.3);font-size:.82rem">Próximamente</p>';

  const videoHtml = m.videoId
    ? `<div class="yt-wrap" id="ytBox" onclick="loadVideo('${m.videoId}')">
         <img class="yt-thumb" src="https://img.youtube.com/vi/${m.videoId}/maxresdefault.jpg" alt="Tutorial" onerror="this.style.display='none'">
         <div class="yt-overlay">
           <div class="yt-play"><i class="fas fa-play"></i></div>
           <strong>Ver tutorial</strong>
           <span>Haz clic para reproducir</span>
         </div>
       </div>`
    : `<div class="yt-wrap" style="cursor:default">
         <div class="yt-overlay" style="background:rgba(6,11,20,.8)">
           <i class="fas fa-video-slash" style="font-size:2rem;color:rgba(255,255,255,.2)"></i>
           <strong style="color:rgba(255,255,255,.3)">Video próximamente</strong>
         </div>
       </div>`;

  const prevM = MISSIONS.find(x => x.id === id - 1);
  const nextM = MISSIONS.find(x => x.id === id + 1);

  wrap.innerHTML = `
    <div class="ms-header">
      <div class="ms-num-badge">
        <div class="big">${m.level}</div>
        <div class="small">MISIÓN</div>
      </div>
      <div class="ms-title-area">
        <h1>${m.title}</h1>
        <div class="ms-chips">
          <span class="chip chip-y"><i class="fas fa-star"></i> ${m.diff}</span>
          <span class="chip chip-cy"><i class="fas fa-child"></i> ${m.age}</span>
          <span class="chip chip-or"><i class="fas fa-clock"></i> ${m.time}</span>
        </div>
      </div>
    </div>

    <div class="ms-body">
      <div class="ms-main">
        ${videoHtml}
        <div class="ms-obj">
          <h3><i class="fas fa-bullseye"></i> Objetivo</h3>
          <p>${m.objective}</p>
        </div>
      </div>

      <div class="ms-side">
        <div class="side-sec">
          <h4><i class="fas fa-cubes"></i> Piezas</h4>
          <div class="pieces">${piecesHtml}</div>
        </div>

        <div class="side-sec">
          <h4><i class="fas fa-list-check"></i> Pasos</h4>
          <div class="steps">${stepsHtml}</div>
        </div>

        <div class="side-sec">
          <button
            class="btn-complete"
            id="btnComplete"
            onclick="completeMission(${id}, this)"
            ${isDone ? 'disabled' : ''}
          >
            ${isDone
              ? '<i class="fas fa-check-circle"></i> ¡Completada!'
              : '<i class="fas fa-trophy"></i> ¡Misión Completada!'}
          </button>
          <div class="worky-toast ${isDone ? 'show' : ''}" id="mToast">
            <img src="images/worky_logro.png" alt="Worky celebra" onerror="this.style.display='none'">
            <div class="worky-toast-txt">
              <strong>¡Excelente trabajo!</strong>
              <p>${m.toast}</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="ms-nav">
      <button class="ms-nav-btn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> Mapa
      </button>
      <div style="display:flex;gap:10px">
        ${prevM ? `<button class="ms-nav-btn" onclick="goTo('s-mission',${prevM.id})">
          <i class="fas fa-arrow-left"></i> Misión ${prevM.level}
        </button>` : ''}
        ${nextM ? `<button class="ms-nav-btn next" onclick="goTo('s-mission',${nextM.id})">
          Misión ${nextM.level} <i class="fas fa-arrow-right"></i>
        </button>` : ''}
      </div>
    </div>
  `;
}

/* ── Complete mission ───────────────────────────────── */
function completeMission(id, btn) {
  if (btn.disabled) return;
  // Particles
  const rect = btn.getBoundingClientRect();
  spawnBurst(rect.left + rect.width/2, rect.top + rect.height/2 + window.scrollY);

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-check-circle"></i> ¡Completada!';

  setTimeout(() => {
    const toast = document.getElementById('mToast');
    if (toast) { toast.classList.add('show'); toast.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
  }, 350);

  if (!completed.includes(id)) {
    completed.push(id);
    localStorage.setItem('bs_completed', JSON.stringify(completed));
  }
  buildTitleDots();
}

/* ── Load YouTube ───────────────────────────────────── */
function loadVideo(videoId) {
  const box = document.getElementById('ytBox');
  if (!box) return;
  const iframe = document.createElement('iframe');
  iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
  iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture';
  iframe.allowFullscreen = true;
  iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;border-radius:16px';
  box.innerHTML = '';
  box.appendChild(iframe);
  box.style.cursor = 'default';
}

/* ── Particle burst ─────────────────────────────────── */
function spawnBurst(x, y) {
  const colors = [
    getComputedStyle(document.documentElement).getPropertyValue('--y').trim() || '#ffd700',
    '#e3000b','#006db7','#00a650','#fff','#00c8ff'
  ];
  const wrap = document.createElement('div');
  wrap.className = 'burst';
  wrap.style.left = x + 'px';
  wrap.style.top  = y + 'px';
  document.body.appendChild(wrap);
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'burst-p';
    const angle = (i / 18) * 360;
    const dist  = 60 + Math.random() * 80;
    p.style.setProperty('--tx', Math.cos(angle * Math.PI/180) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle * Math.PI/180) * dist + 'px');
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.width = p.style.height = (6 + Math.random() * 8) + 'px';
    p.style.animationDelay = (Math.random() * .1) + 's';
    wrap.appendChild(p);
  }
  setTimeout(() => wrap.remove(), 1100);
}

/* ── Generate stars ─────────────────────────────────── */
function generateStars() {
  const bg = document.getElementById('starsBg');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + .5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --d:${2 + Math.random()*4}s;
      --delay:${-Math.random()*4}s;
    `;
    bg.appendChild(s);
  }
}

/* ── Init ───────────────────────────────────────────── */
generateStars();
buildTitleDots();
</script>
