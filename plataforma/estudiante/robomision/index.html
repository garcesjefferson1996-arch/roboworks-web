<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>RoboMisión</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Nunito',sans-serif;background:#0d0b1e;color:#fff;overflow-x:hidden}
body{background:linear-gradient(160deg,#0d0b1e 0%,#1a1040 50%,#0d1b2a 100%);min-height:100vh}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;width:100%;flex-direction:column;align-items:center;padding:1rem 1rem 2rem}
.screen.active{display:flex}

/* ══════════ SETUP ══════════ */
#screen-setup{justify-content:center;gap:1.5rem}
.setup-logo{width:min(280px,80vw);margin-bottom:.5rem}
.setup-tagline{color:#a78bfa;font-size:.95rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:.5rem}
.setup-card{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:24px;padding:1.75rem 1.5rem;width:100%;max-width:460px;backdrop-filter:blur(12px)}
.setup-card h2{font-size:1.2rem;font-weight:800;text-align:center;margin-bottom:1.25rem;color:#e2e8f0}
.team-row{display:flex;align-items:center;gap:.65rem;margin-bottom:.65rem}
.team-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
.team-inp{flex:1;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;padding:.55rem .9rem;color:#fff;font-size:.95rem;font-family:inherit;font-weight:700;outline:none;transition:.2s}
.team-inp:focus{border-color:#a78bfa;background:rgba(167,139,250,.1)}
.team-inp::placeholder{color:rgba(255,255,255,.25);font-weight:400}
.rm-btn{background:none;border:none;color:rgba(255,255,255,.25);cursor:pointer;font-size:1.1rem;padding:0 .2rem;line-height:1;transition:.2s}
.rm-btn:hover{color:#f87171}
.add-btn{width:100%;padding:.55rem;background:rgba(167,139,250,.1);border:1.5px dashed rgba(167,139,250,.4);border-radius:12px;color:#a78bfa;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;margin-bottom:1.25rem;transition:.2s}
.add-btn:hover{background:rgba(167,139,250,.2)}
.go-btn{width:100%;padding:1rem;background:linear-gradient(135deg,#7c3aed,#2563eb);border:none;border-radius:16px;color:#fff;font-family:inherit;font-size:1.15rem;font-weight:900;cursor:pointer;letter-spacing:.5px;box-shadow:0 6px 24px rgba(124,58,237,.4);transition:.2s}
.go-btn:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(124,58,237,.5)}

/* ══════════ BOARD ══════════ */
#screen-board{padding:0;justify-content:flex-start}
.board-wrap{display:flex;flex-direction:column;width:100%;max-width:680px;min-height:100vh}

.board-topbar{background:rgba(0,0,0,.5);border-bottom:1px solid rgba(255,255,255,.08);padding:.8rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.board-logo-sm{height:32px}
.turn-pill{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.12);border-radius:20px;padding:.3rem .85rem;font-size:.82rem;font-weight:700;white-space:nowrap}
.reset-btn{background:none;border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:rgba(255,255,255,.5);padding:.3rem .7rem;font-size:.78rem;cursor:pointer;font-family:inherit;transition:.2s}
.reset-btn:hover{border-color:#f87171;color:#f87171}

.teams-bar{display:flex;gap:.5rem;padding:.75rem 1rem;overflow-x:auto;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(255,255,255,.06)}
.team-tile{flex-shrink:0;border-radius:16px;padding:.5rem .85rem;border:2px solid transparent;transition:.25s;min-width:90px}
.team-tile.active{border-color:var(--c);background:rgba(var(--cr),.12);box-shadow:0 0 14px rgba(var(--cr),.3)}
.tile-name{font-size:.8rem;font-weight:800;display:block;color:#e2e8f0}
.tile-pos{font-size:.68rem;color:rgba(255,255,255,.45)}
.tile-pieces{display:flex;gap:2px;margin-top:.2rem;flex-wrap:wrap}
.tp{font-size:.7rem;filter:grayscale(1);opacity:.35;transition:.2s}
.tp.got{filter:none;opacity:1}

.board-title{text-align:center;padding:.9rem .5rem .5rem;font-size:.8rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:2px}

.decks-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;padding:.5rem 1rem 1rem;flex:1}
.deck-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.08);border-radius:20px;cursor:pointer;transition:.25s;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:0;position:relative}
.deck-card:hover{transform:translateY(-4px);background:rgba(255,255,255,.08)}
.deck-card:active{transform:scale(.97)}
.deck-img{width:100%;object-fit:contain;padding:.5rem .5rem 0}
.deck-remaining{position:absolute;top:.5rem;right:.5rem;background:rgba(0,0,0,.55);border-radius:20px;font-size:.62rem;padding:.15rem .45rem;color:rgba(255,255,255,.7);font-weight:700}

.board-score{background:rgba(0,0,0,.3);border-top:1px solid rgba(255,255,255,.06);padding:.85rem 1rem}
.score-title{font-size:.68rem;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.3);margin-bottom:.55rem}
.score-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem;font-size:.8rem}
.s-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.s-name{flex:1;font-weight:700;color:#e2e8f0}
.s-pos{color:rgba(255,255,255,.38);font-size:.72rem}
.s-pieces{display:flex;gap:1px}
.sp{font-size:.68rem;filter:grayscale(1);opacity:.3}
.sp.g{filter:none;opacity:1}

/* ══════════ CARD ══════════ */
#screen-card{padding:0;justify-content:flex-start;align-items:stretch}
.card-wrap{display:flex;flex-direction:column;width:100%;max-width:680px;min-height:100vh}

.card-topbar{background:rgba(0,0,0,.55);border-bottom:1px solid rgba(255,255,255,.08);padding:.7rem 1rem;display:flex;align-items:center;gap:.75rem}
.back-btn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:#c4b5fd;padding:.35rem .8rem;font-size:.82rem;cursor:pointer;font-family:inherit;font-weight:700;transition:.2s}
.back-btn:hover{border-color:#a78bfa;color:#a78bfa}
.card-top-info{flex:1}
.deck-name-badge{font-size:.75rem;font-weight:900;padding:.15rem .6rem;border-radius:20px;display:inline-block;letter-spacing:.5px}
.card-team-label{font-size:.75rem;color:rgba(255,255,255,.4);margin-top:.1rem}

/* Robot + Timer header */
.card-hero{display:flex;align-items:flex-end;justify-content:space-between;padding:.5rem 1.25rem 0;background:rgba(0,0,0,.2)}
.robot-img{width:min(110px,28vw);object-fit:contain}
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.timer-svg{width:72px;height:72px}
.timer-track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:5}
.timer-fill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .5s;transform-origin:center;transform:rotate(-90deg)}
.timer-num{font-size:1.1rem;font-weight:900}
.timer-label{font-size:.6rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px}

/* Subtipo */
.subtipo-pill{display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:.2rem .7rem;font-size:.7rem;color:rgba(255,255,255,.6);margin:0 1.25rem .5rem;font-weight:700}

/* Reto box */
.reto-box{margin:.25rem 1.25rem .75rem;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:16px;padding:1.1rem}
.reto-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.35);font-weight:800;margin-bottom:.45rem}
.reto-text{font-size:1rem;line-height:1.55;color:#e2e8f0;font-weight:600}

/* MC options */
.opts{display:flex;flex-direction:column;gap:.55rem;margin:0 1.25rem .75rem}
.opt{display:flex;align-items:flex-start;gap:.75rem;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:.75rem .9rem;cursor:pointer;font-family:inherit;font-size:.92rem;font-weight:600;color:#e2e8f0;text-align:left;transition:.2s;width:100%}
.opt:hover:not(:disabled){border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1)}
.opt:disabled{cursor:default}
.opt-letter{font-weight:900;font-size:.9rem;min-width:22px;color:rgba(255,255,255,.4)}
.opt.correct{border-color:#22c55e!important;background:rgba(34,197,94,.15)!important;color:#86efac}
.opt.correct .opt-letter{color:#22c55e}
.opt.wrong{border-color:#ef4444!important;background:rgba(239,68,68,.15)!important;color:#fca5a5}
.opt.wrong .opt-letter{color:#ef4444}
.opt.show-correct{border-color:#22c55e;background:rgba(34,197,94,.08);color:#86efac}
.opt.show-correct .opt-letter{color:#22c55e}

/* Hint / Answer for open cards */
.card-actions{display:flex;flex-direction:column;gap:.6rem;margin:0 1.25rem .75rem}
.toggle-btn{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:12px;padding:.65rem 1rem;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:700;color:#c4b5fd;transition:.2s;text-align:left}
.toggle-btn:hover{background:rgba(167,139,250,.15);border-color:#a78bfa}
.reveal-box{display:none;background:rgba(167,139,250,.07);border:1.5px solid rgba(167,139,250,.25);border-radius:12px;padding:.9rem 1rem;font-size:.88rem;line-height:1.55;color:#e2e8f0}
.reveal-box.show{display:block}
.reveal-lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;color:#a78bfa;font-weight:900;margin-bottom:.35rem}
.hint-box{display:none;background:rgba(251,191,36,.07);border:1.5px solid rgba(251,191,36,.2);border-radius:12px;padding:.9rem 1rem;font-size:.88rem;line-height:1.55;color:#fde68a}
.hint-box.show{display:block}
.hint-lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;color:#fbbf24;font-weight:900;margin-bottom:.35rem}

/* Card footer */
.card-footer{padding:1rem 1.25rem 1.5rem;border-top:1px solid rgba(255,255,255,.07);margin-top:auto}
.footer-hint{text-align:center;color:rgba(255,255,255,.3);font-size:.8rem;padding:.5rem 0}
.judge-btns{display:flex;gap:.75rem}
.judge-btn{flex:1;padding:.85rem;border:none;border-radius:16px;font-family:inherit;font-size:1rem;font-weight:900;cursor:pointer;transition:.2s;letter-spacing:.5px}
.judge-btn.yes{background:linear-gradient(135deg,#15803d,#22c55e);color:#fff;box-shadow:0 4px 16px rgba(34,197,94,.3)}
.judge-btn.no{background:linear-gradient(135deg,#991b1b,#ef4444);color:#fff;box-shadow:0 4px 16px rgba(239,68,68,.3)}
.judge-btn:hover{transform:translateY(-2px)}

/* ══════════ FEEDBACK OVERLAY ══════════ */
#feedback-overlay{display:none;position:fixed;inset:0;z-index:100;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
#feedback-overlay.show{display:flex}
.fb-bg-correct{background:radial-gradient(ellipse at center,rgba(34,197,94,.35) 0%,rgba(13,11,30,.97) 70%)}
.fb-bg-wrong{background:radial-gradient(ellipse at center,rgba(239,68,68,.3) 0%,rgba(13,11,30,.97) 70%)}
.fb-emoji{font-size:5rem;margin-bottom:.5rem;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.fb-title{font-size:2.2rem;font-weight:900;margin-bottom:.5rem;animation:slideUp .35s ease}
.fb-title.correct{color:#86efac}
.fb-title.wrong{color:#fca5a5}
.fb-sub{color:rgba(255,255,255,.65);font-size:.95rem;margin-bottom:1.5rem;line-height:1.5}
.fb-piece{background:rgba(167,139,250,.15);border:2px solid rgba(167,139,250,.4);border-radius:16px;padding:.75rem 1.5rem;margin-bottom:1.25rem;font-size:1rem;font-weight:700;color:#c4b5fd;animation:pop .5s .2s both cubic-bezier(.34,1.56,.64,1)}
.fb-penalty{background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.3);border-radius:16px;padding:.65rem 1.25rem;margin-bottom:1.25rem;font-size:.9rem;color:#fca5a5}
.fb-continue{padding:.9rem 2.5rem;background:linear-gradient(135deg,#7c3aed,#2563eb);border:none;border-radius:16px;color:#fff;font-family:inherit;font-size:1.05rem;font-weight:900;cursor:pointer;letter-spacing:.5px;box-shadow:0 6px 24px rgba(124,58,237,.4);transition:.2s}
.fb-continue:hover{transform:translateY(-2px)}

/* ══════════ WIN SCREEN ══════════ */
#screen-win{justify-content:center;gap:1rem}
.win-card{background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(37,99,235,.18));border:2px solid rgba(167,139,250,.35);border-radius:28px;padding:2.5rem 2rem;max-width:440px;width:100%;text-align:center;backdrop-filter:blur(20px)}
.win-trophy{font-size:4rem;margin-bottom:.25rem;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.win-h1{font-size:2.2rem;font-weight:900;background:linear-gradient(90deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.25rem}
.win-team{font-size:1.3rem;font-weight:800;color:#e2e8f0;margin-bottom:.5rem}
.win-sub{color:#a5b4fc;font-size:.9rem;margin-bottom:1.5rem}
.win-pieces{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:1.75rem}
.win-piece{background:rgba(167,139,250,.15);border:1.5px solid rgba(167,139,250,.35);border-radius:20px;padding:.35rem .9rem;font-size:.85rem;font-weight:700;color:#e2e8f0}
.again-btn{width:100%;padding:1rem;background:linear-gradient(135deg,#7c3aed,#2563eb);border:none;border-radius:16px;color:#fff;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;transition:.2s;box-shadow:0 6px 24px rgba(124,58,237,.4)}
.again-btn:hover{transform:translateY(-2px)}

/* ══════════ CONFETTI ══════════ */
.confetti-piece{position:fixed;width:10px;height:10px;top:-10px;animation:confettiFall linear forwards;pointer-events:none;z-index:200;border-radius:2px}
@keyframes confettiFall{to{top:110vh;transform:rotate(720deg)}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ══════════ UTILS ══════════ */
.hidden{display:none!important}
</style>
</head>
<body>

<!-- SETUP -->
<div id="screen-setup" class="screen active">
  <img src="assets/src/assets/images/logo.3c780f551b8db7580a10ad560a58d64a.png" class="setup-logo" alt="RoboMisión" onerror="this.style.display='none';document.getElementById('fallback-logo').style.display='block'">
  <div id="fallback-logo" style="display:none;font-size:2.2rem;font-weight:900;background:linear-gradient(90deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">🤖 ROBOMISIÓN</div>
  <div class="setup-tagline">El juego de robótica en equipo</div>
  <div class="setup-card">
    <h2>¿Quiénes juegan?</h2>
    <div id="team-inputs"></div>
    <button class="add-btn" id="add-btn" onclick="addTeam()">+ Agregar equipo (máx. 4)</button>
    <button class="go-btn" onclick="startGame()">🚀 ¡Comenzar misión!</button>
  </div>
</div>

<!-- BOARD -->
<div id="screen-board" class="screen">
  <div class="board-wrap">
    <div class="board-topbar">
      <img src="assets/src/assets/images/logo.3c780f551b8db7580a10ad560a58d64a.png" class="board-logo-sm" alt="RoboMisión" onerror="this.style.cssText+='display:none'">
      <div id="turn-pill" class="turn-pill"></div>
      <button class="reset-btn" onclick="restartGame()">↺ Reiniciar</button>
    </div>
    <div class="teams-bar" id="teams-bar"></div>
    <div class="board-title">Elige una categoría para tu turno</div>
    <div class="decks-grid">
      <button class="deck-card" onclick="drawCard('mentaloide')" id="deck-mentaloide">
        <img src="assets/src/assets/images/boton-mentaloide.5680df75e4c2a73e81bcd18e3b0f56bd.png" class="deck-img" alt="Mentaloide">
        <span class="deck-remaining" id="rem-mentaloide"></span>
      </button>
      <button class="deck-card" onclick="drawCard('logibot')" id="deck-logibot">
        <img src="assets/src/assets/images/boton-logibot.bb73e0056bd824f4cc8e369ff7ffc9d2.png" class="deck-img" alt="Logibot">
        <span class="deck-remaining" id="rem-logibot"></span>
      </button>
      <button class="deck-card" onclick="drawCard('creatius')" id="deck-creatius">
        <img src="assets/src/assets/images/boton-creatius.6829d43f0635994f52ade7b8f493f4ed.png" class="deck-img" alt="Creatius">
        <span class="deck-remaining" id="rem-creatius"></span>
      </button>
      <button class="deck-card" onclick="drawCard('mimix')" id="deck-mimix">
        <img src="assets/src/assets/images/boton-mimix.e997b1fdaf4a10d38dbd792b9c29be0d.png" class="deck-img" alt="Mimix">
        <span class="deck-remaining" id="rem-mimix"></span>
      </button>
    </div>
    <div class="board-score">
      <div class="score-title">Piezas recolectadas</div>
      <div id="score-rows"></div>
    </div>
  </div>
</div>

<!-- CARD -->
<div id="screen-card" class="screen">
  <div class="card-wrap">
    <div class="card-topbar">
      <button class="back-btn" onclick="goBoard()">← Menú</button>
      <div class="card-top-info">
        <div id="card-badge" class="deck-name-badge"></div>
        <div id="card-team" class="card-team-label"></div>
      </div>
    </div>
    <div class="card-hero">
      <img id="robot-img" class="robot-img" src="" alt="">
      <div class="timer-wrap">
        <svg class="timer-svg" viewBox="0 0 72 72">
          <circle class="timer-track" cx="36" cy="36" r="30"/>
          <circle class="timer-fill" id="timer-fill" cx="36" cy="36" r="30"
            stroke-dasharray="188.5" stroke-dashoffset="0" stroke="#a78bfa"/>
        </svg>
        <div class="timer-num" id="timer-num">60</div>
        <div class="timer-label">seg.</div>
      </div>
    </div>
    <div id="card-content"></div>
    <div class="card-footer" id="card-footer"></div>
  </div>
</div>

<!-- FEEDBACK OVERLAY -->
<div id="feedback-overlay">
  <div class="fb-emoji" id="fb-emoji"></div>
  <div class="fb-title" id="fb-title"></div>
  <div class="fb-sub" id="fb-sub"></div>
  <div id="fb-extras"></div>
  <button class="fb-continue" onclick="nextTurn()">Siguiente turno →</button>
</div>

<!-- WIN -->
<div id="screen-win" class="screen">
  <div class="win-card">
    <div class="win-trophy">🏆</div>
    <div class="win-h1">¡GANARON!</div>
    <div class="win-team" id="win-team"></div>
    <div class="win-sub">¡Completaron el robot con todas las piezas!</div>
    <div class="win-pieces" id="win-pieces"></div>
    <button class="again-btn" onclick="restartGame()">🔄 Jugar de nuevo</button>
  </div>

<script>

const PIECES   = ['Procesador','Motor','Batería','Sensor','Estructura'];
const PIE_EMO  = {Procesador:'⚙️',Motor:'🔧',Batería:'🔋',Sensor:'📡',Estructura:'🦿'};
const TC = ['#f97316','#22c55e','#3b82f6','#e879f9'];
const DECK_COL = {mentaloide:'#ef4444',logibot:'#eab308',creatius:'#3b82f6',mimix:'#a855f7'};
const ROBOT_IMG = {
  mentaloide:'assets/src/assets/images/robot-mentaloide-recortado.199ebe6b3fb3eebf64ae9e9fbc3a0d9d.png',
  logibot:'assets/src/assets/images/robot-logibot-recortado.5add81c0e42fcb983e58de1536ee40e0.png',
  creatius:'assets/src/assets/images/robot-creatius-recortado.9e2dad162df5829ecd22ef85fcb2799b.png',
  mimix:'assets/src/assets/images/robot-mimix-recortado.d39b3b64851488fd2e7ec99c044222ca.png'
};
const DEFAULTS = ['Equipo Rojo','Equipo Verde','Equipo Azul','Equipo Morado'];
const MAX_POS = 20;
const TIMER_MAX = 60;
const CIRC = 2 * Math.PI * 30; // 188.5

let G = {teams:[],cur:0,used:{mentaloide:[],logibot:[],creatius:[],mimix:[]},card:null,deck:null};
let timerInterval = null;
let timerSec = TIMER_MAX;

/* ── SETUP ── */
function initSetup(){
  G.teams = [];
  document.getElementById('add-btn').style.display='block';
  for(let i=0;i<2;i++) addTeam(false);
  renderInputs();
}
function addTeam(render=true){
  if(G.teams.length>=4)return;
  const i = G.teams.length;
  G.teams.push({name:DEFAULTS[i],pos:0,pieces:[]});
  if(render) renderInputs();
  document.getElementById('add-btn').style.display = G.teams.length>=4?'none':'block';
}
function removeTeam(i){
  if(G.teams.length<=2)return;
  G.teams.splice(i,1);
  renderInputs();
  document.getElementById('add-btn').style.display='block';
}
function renderInputs(){
  document.getElementById('team-inputs').innerHTML = G.teams.map((t,i)=>`
    <div class="team-row">
      <div class="team-dot" style="background:${TC[i]};color:${TC[i]}"></div>
      <input class="team-inp" type="text" value="${h(t.name)}" placeholder="${DEFAULTS[i]}"
        oninput="G.teams[${i}].name=this.value" maxlength="20">
      ${G.teams.length>2?`<button class="rm-btn" onclick="removeTeam(${i})">✕</button>`:''}
    </div>
  `).join('');
}
function startGame(){
  G.teams = G.teams.map((t,i)=>({name:t.name.trim()||DEFAULTS[i],pos:0,pieces:[]}));
  G.cur = 0;
  G.used = {mentaloide:[],logibot:[],creatius:[],mimix:[]};
  show('board'); renderBoard();
}

/* ── BOARD ── */
function renderBoard(){
  // turn pill
  const t = G.teams[G.cur];
  document.getElementById('turn-pill').innerHTML =
    `Turno: <span style="color:${TC[G.cur]};font-weight:900">${h(t.name)}</span>`;

  // teams bar
  document.getElementById('teams-bar').innerHTML = G.teams.map((tm,i)=>{
    const act = i===G.cur;
    const r=parseInt(TC[i].slice(1,3),16),g=parseInt(TC[i].slice(3,5),16),b=parseInt(TC[i].slice(5,7),16);
    const pHtml = PIECES.map(p=>`<span class="tp${tm.pieces.includes(p)?' got':''}">${PIE_EMO[p]}</span>`).join('');
    return `<div class="team-tile${act?' active':''}" style="--c:${TC[i]};--cr:${r},${g},${b}">
      <span class="tile-name" style="${act?'color:'+TC[i]:''}">${h(tm.name)}</span>
      <span class="tile-pos">Casilla ${tm.pos}/${MAX_POS}</span>
      <div class="tile-pieces">${pHtml}</div>
    </div>`;
  }).join('');

  // remaining badges
  ['mentaloide','logibot','creatius','mimix'].forEach(d=>{
    document.getElementById('rem-'+d).textContent = (25-G.used[d].length)+' cartas';
  });

  // scoreboard
  document.getElementById('score-rows').innerHTML = G.teams.map((tm,i)=>{
    const ph = PIECES.map(p=>`<span class="sp${tm.pieces.includes(p)?' g':''}">${PIE_EMO[p]}</span>`).join('');
    return `<div class="score-row">
      <div class="s-dot" style="background:${TC[i]}"></div>
      <span class="s-name">${h(tm.name)}</span>
      <span class="s-pos">Cas. ${tm.pos}</span>
      <div class="s-pieces">${ph}</div>
    </div>`;
  }).join('');
}

/* ── DRAW CARD ── */
function drawCard(deck){
  const pool = CARDS[deck].cartas;
  const avail = pool.map((_,i)=>i).filter(i=>!G.used[deck].includes(i));
  if(!avail.length){ alert('¡Todas las cartas de este mazo se usaron!'); return; }
  const idx = avail[Math.floor(Math.random()*avail.length)];
  G.used[deck].push(idx);
  G.card = pool[idx];
  G.deck = deck;
  show('card'); renderCard(); startTimer();
}

/* ── CARD ── */
function renderCard(){
  const c = G.card, d = G.deck;
  const col = DECK_COL[d];
  const t = G.teams[G.cur];

  // badge
  const badge = document.getElementById('card-badge');
  badge.textContent = d.toUpperCase();
  badge.style.cssText = `background:${col}22;color:${col};border:1.5px solid ${col}44`;

  document.getElementById('card-team').textContent = 'Turno: ' + t.name;
  document.getElementById('robot-img').src = ROBOT_IMG[d];

  // timer reset
  const fill = document.getElementById('timer-fill');
  fill.style.stroke = col;
  fill.style.strokeDashoffset = '0';
  document.getElementById('timer-num').textContent = TIMER_MAX;

  const isMC = 'opciones' in c;
  let html = '';

  // subtipo
  if(c.subtipo) html += `<div class="subtipo-pill">🎯 ${h(c.subtipo)}</div>`;

  // reto
  html += `<div class="reto-box"><div class="reto-label">🎯 Reto del turno</div><div class="reto-text">${h(c.reto)}</div></div>`;

  if(isMC){
    html += `<div class="opts">${['a','b','c'].map(l=>
      `<button class="opt" id="opt-${l}" onclick="pickOpt('${l}')" type="button">
        <span class="opt-letter">${l.toUpperCase()})</span>
        <span>${h(c.opciones[l])}</span>
      </button>`
    ).join('')}</div>`;
  } else {
    html += `<div class="card-actions">`;
    if(c.pista) html += `
      <button class="toggle-btn" onclick="toggleBox(this,'hint-box')">💡 Ver pista</button>
      <div class="hint-box" id="hint-box"><div class="hint-lbl">Pista para el equipo</div>${h(c.pista)}</div>`;
    html += `
      <button class="toggle-btn" onclick="toggleBox(this,'ans-box')">🔍 Revelar respuesta</button>
      <div class="reveal-box" id="ans-box"><div class="reveal-lbl">Respuesta correcta</div>${h(c.solucion||c.respuesta||'')}</div>
    </div>`;
  }

  document.getElementById('card-content').innerHTML = html;

  // footer
  const footer = document.getElementById('card-footer');
  if(isMC){
    footer.innerHTML = `<p class="footer-hint">Elige una opción de arriba</p>`;
  } else {
    footer.innerHTML = `
      <div style="text-align:center;font-size:.8rem;color:rgba(255,255,255,.35);margin-bottom:.75rem">
        ¿El equipo respondió bien?
      </div>
      <div class="judge-btns">
        <button class="judge-btn no" onclick="resolve(false)">✗ Incorrecto</button>
        <button class="judge-btn yes" onclick="resolve(true)">✓ ¡Correcto!</button>
      </div>`;
  }
}

function toggleBox(btn, id){
  const box = document.getElementById(id);
  const shown = box.classList.toggle('show');
  if(id==='hint-box') btn.textContent = shown ? '💡 Ocultar pista' : '💡 Ver pista';
  else btn.textContent = shown ? '🔍 Ocultar respuesta' : '🔍 Revelar respuesta';
}

/* ── TIMER ── */
function startTimer(){
  stopTimer();
  timerSec = TIMER_MAX;
  const fill = document.getElementById('timer-fill');
  const num  = document.getElementById('timer-num');
  timerInterval = setInterval(()=>{
    timerSec--;
    num.textContent = timerSec;
    const pct = timerSec / TIMER_MAX;
    fill.style.strokeDashoffset = CIRC * (1 - pct);
    if(timerSec <= 10){ fill.style.stroke = '#ef4444'; num.style.color='#fca5a5'; }
    else if(timerSec <= 25){ fill.style.stroke = '#eab308'; num.style.color='#fde047'; }
    if(timerSec <= 0){ stopTimer(); resolve(false); }
  },1000);
}
function stopTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  // reset color
  const num = document.getElementById('timer-num');
  if(num) num.style.color = '';
}

/* ── MULTIPLE CHOICE ── */
function pickOpt(letter){
  stopTimer();
  const correct = G.card.respuesta;
  const isRight = letter === correct;
  ['a','b','c'].forEach(l=>{
    const btn = document.getElementById('opt-'+l);
    if(!btn)return;
    btn.disabled = true;
    btn.onclick = null;
    if(l===correct) btn.classList.add('show-correct');
    if(l===letter){
      btn.classList.remove('show-correct');
      btn.classList.add(isRight?'correct':'wrong');
    }
  });
  setTimeout(()=>resolve(isRight), 900);
}

/* ── RESOLVE ── */
function resolve(correct){
  stopTimer();
  const c = G.card;
  const team = G.teams[G.cur];
  let pieceEarned = null;
  let adv=0, ret=0;
  if(correct){
    adv=2;
    if(c.pieza && !team.pieces.includes(c.pieza)){
      pieceEarned = c.pieza;
      team.pieces.push(c.pieza);
    }
  } else {
    if(c.penalizacion) ret=2;
  }
  team.pos = Math.min(MAX_POS, Math.max(0, team.pos + adv - ret));
  showFeedback(correct, pieceEarned, adv, ret, team);
}

/* ── FEEDBACK ── */
function showFeedback(correct, piece, adv, ret, team){
  const ov = document.getElementById('feedback-overlay');
  ov.className = 'show ' + (correct?'fb-bg-correct':'fb-bg-wrong');

  document.getElementById('fb-emoji').textContent = correct ? '🎉' : '💥';
  const title = document.getElementById('fb-title');
  title.textContent = correct ? '¡Correcto!' : '¡Incorrecto!';
  title.className = 'fb-title ' + (correct?'correct':'wrong');

  let sub = correct
    ? `<strong style="color:${TC[G.cur]}">${h(team.name)}</strong> avanza ${adv} casillas → Casilla ${team.pos}`
    : `No fue correcto.${ret>0?` <strong style="color:${TC[G.cur]}">${h(team.name)}</strong> retrocede ${ret} casillas → Casilla ${team.pos}`:''}<br><br>La respuesta: <em>${h(G.card.solucion||G.card.respuesta||'')}</em>`;
  document.getElementById('fb-sub').innerHTML = sub;

  let extras = '';
  if(piece) extras += `<div class="fb-piece">🏅 ¡Pieza obtenida! ${PIE_EMO[piece]} ${piece}</div>`;
  if(!correct && G.card.penalizacion && ret>0) extras += `<div class="fb-penalty">⚡ Penalización: retrocede ${ret} casillas</div>`;
  document.getElementById('fb-extras').innerHTML = extras;

  if(correct) spawnConfetti();
  if(team.pieces.length>=5 || team.pos>=MAX_POS){
    setTimeout(()=>showWin(team), 1600);
  }
}

function nextTurn(){
  document.getElementById('feedback-overlay').className = '';
  G.cur = (G.cur+1) % G.teams.length;
  show('board'); renderBoard();
}

function goBoard(){
  stopTimer();
  document.getElementById('feedback-overlay').className = '';
  show('board'); renderBoard();
}

/* ── WIN ── */
function showWin(team){
  document.getElementById('feedback-overlay').className='';
  show('win');
  document.getElementById('win-team').textContent = team.name;
  document.getElementById('win-pieces').innerHTML = PIECES.map(p=>
    `<div class="win-piece">${PIE_EMO[p]} ${p}</div>`
  ).join('');
  for(let i=0;i<80;i++) setTimeout(()=>spawnConfetti(),i*80);
}

/* ── CONFETTI ── */
const CONF_COLORS = ['#a78bfa','#60a5fa','#22c55e','#f97316','#e879f9','#fbbf24'];
function spawnConfetti(){
  const el = document.createElement('div');
  el.className = 'confetti-piece';
  el.style.cssText = `
    left:${Math.random()*100}vw;
    background:${CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)]};
    width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;
    border-radius:${Math.random()>.5?'50%':'2px'};
    animation-duration:${1.5+Math.random()*2}s;
    animation-delay:${Math.random()*.5}s;
    opacity:${.7+Math.random()*.3}
  `;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}

/* ── RESTART ── */
function restartGame(){
  stopTimer();
  document.getElementById('feedback-overlay').className='';
  show('setup'); initSetup();
}

/* ── UTILS ── */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}
function h(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

initSetup();
</script>
