<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar contraseña — RoboWorks</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" href="/assets/icons/favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:linear-gradient(140deg,#003d63,#00a8e8)}
.box{background:#fff;border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.logo-row{text-align:center;margin-bottom:1.75rem}
.logo-row img{height:48px;margin-bottom:.75rem}
.logo-row h2{font-size:1.3rem;font-weight:700;color:#1e293b}
.logo-row p{font-size:.85rem;color:#64748b;margin-top:.3rem}
.field{margin-bottom:1.1rem}
.field label{display:block;font-size:.82rem;font-weight:600;color:#1e293b;margin-bottom:.4rem}
.pw-wrap{position:relative}
.pw-wrap input{width:100%;padding:.8rem 2.5rem .8rem 1rem;border:2px solid #e2e8f0;border-radius:10px;font-size:.9rem;font-family:inherit;outline:none;transition:.2s;color:#1e293b}
.pw-wrap input:focus{border-color:#00a8e8;background:#f0f9ff}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;font-size:.95rem;padding:.25rem}
.eye:hover{color:#00a8e8}
.req-list{background:#f8fafc;border-radius:8px;padding:.75rem;margin:.75rem 0;font-size:.78rem}
.req-list li{list-style:none;display:flex;align-items:center;gap:.5rem;color:#64748b;margin-bottom:.25rem}
.req-list li i{font-size:.75rem}
.btn{width:100%;padding:.875rem;border:none;border-radius:10px;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#00a8e8,#0086bb);color:#fff;transition:.2s;margin-top:.25rem}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,168,232,.35)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.alert{padding:.8rem 1rem;border-radius:8px;font-size:.82rem;margin-bottom:1rem;display:none;align-items:center;gap:.6rem}
.alert-err{background:#fef2f2;color:#dc2626;border-left:3px solid #dc2626}
.alert-ok{background:#f0fdf4;color:#059669;border-left:3px solid #059669}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:none;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="logo-row">
    <img src="/assets/icons/logo.png" alt="RoboWorks">
    <h2>Cambia tu contraseña</h2>
    <p>Por seguridad, elige una nueva contraseña</p>
  </div>
  <div class="alert alert-err" id="err"><i class="fas fa-exclamation-circle"></i><span id="err-txt"></span></div>
  <div class="alert alert-ok" id="ok"><i class="fas fa-check-circle"></i><span id="ok-txt"></span></div>
  <form id="frm" novalidate>
    <div class="field">
      <label>Contraseña actual</label>
      <div class="pw-wrap">
        <input type="password" id="current" placeholder="Tu contraseña actual" required>
        <button type="button" class="eye" onclick="tog('current',this)"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <div class="field">
      <label>Nueva contraseña</label>
      <div class="pw-wrap">
        <input type="password" id="newpw" placeholder="Mínimo 6 caracteres" required oninput="check()">
        <button type="button" class="eye" onclick="tog('newpw',this)"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <div class="field">
      <label>Confirmar nueva contraseña</label>
      <div class="pw-wrap">
        <input type="password" id="confirm" placeholder="Repite la nueva contraseña" required oninput="check()">
        <button type="button" class="eye" onclick="tog('confirm',this)"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <ul class="req-list">
      <li id="r-len"><i class="fas fa-circle"></i>Al menos 6 caracteres</li>
      <li id="r-match"><i class="fas fa-circle"></i>Las contraseñas coinciden</li>
    </ul>
    <button type="submit" class="btn" id="sbtn">
      <span id="btxt">Cambiar contraseña</span>
      <div class="spin" id="bspin"></div>
    </button>
  </form>
  <p style="text-align:center;margin-top:1.25rem;font-size:.8rem;color:#94a3b8">
    <a href="dashboard.html" style="color:#00a8e8;font-weight:600;text-decoration:none">← Volver al panel</a>
  </p>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDYbas3MnL0u5wOyXO1Ok70lC3wSIGb0gM",authDomain:"roboworks-app.firebaseapp.com",projectId:"roboworks-app",storageBucket:"roboworks-app.firebasestorage.app",messagingSenderId:"824986583831",appId:"1:824986583831:web:7477911bd5cb95a18a6d52"});
const db=firebase.firestore();

function tog(id,btn){
  const inp=document.getElementById(id);
  const show=inp.type==='password';
  inp.type=show?'text':'password';
  btn.querySelector('i').className=show?'fas fa-eye-slash':'fas fa-eye';
}
function check(){
  const nv=document.getElementById('newpw').value;
  const cv=document.getElementById('confirm').value;
  const rLen=document.getElementById('r-len');
  const rMatch=document.getElementById('r-match');
  rLen.innerHTML=nv.length>=6?'<i class="fas fa-check-circle" style="color:#059669"></i>Al menos 6 caracteres ✓':'<i class="fas fa-circle"></i>Al menos 6 caracteres';
  rMatch.innerHTML=(nv&&nv===cv)?'<i class="fas fa-check-circle" style="color:#059669"></i>Coinciden ✓':'<i class="fas fa-circle"></i>Las contraseñas coinciden';
}
function showErr(msg){const e=document.getElementById('err');e.querySelector('#err-txt').textContent=msg;e.style.display='flex';document.getElementById('ok').style.display='none';}
function showOk(msg){const e=document.getElementById('ok');e.querySelector('#ok-txt').textContent=msg;e.style.display='flex';document.getElementById('err').style.display='none';}
function setLoad(on){const btn=document.getElementById('sbtn');btn.disabled=on;document.getElementById('btxt').style.display=on?'none':'inline';document.getElementById('bspin').style.display=on?'block':'none';}

const student=JSON.parse(localStorage.getItem('currentStudent')||'null');
if(!student){window.location.href='login.html';}

document.getElementById('frm').addEventListener('submit',async e=>{
  e.preventDefault();
  const current=document.getElementById('current').value;
  const newpw=document.getElementById('newpw').value;
  const confirm=document.getElementById('confirm').value;
  if(!current||!newpw||!confirm){showErr('Completa todos los campos');return;}
  if(newpw.length<6){showErr('La nueva contraseña debe tener al menos 6 caracteres');return;}
  if(newpw!==confirm){showErr('Las contraseñas nuevas no coinciden');return;}
  if(current===newpw){showErr('La nueva contraseña debe ser diferente a la actual');return;}
  setLoad(true);
  try{
    // Verify current password
    const snap=await db.collection('students').where('username','==',student.username).where('password','==',current).get();
    if(snap.empty){showErr('La contraseña actual es incorrecta');setLoad(false);return;}
    // Update password
    await db.collection('students').doc(student.id).update({password:newpw});
    // Update localStorage
    student.password=newpw;
    localStorage.setItem('currentStudent',JSON.stringify(student));
    showOk('¡Contraseña cambiada con éxito! Redirigiendo...');
    setTimeout(()=>window.location.href='dashboard.html',1800);
  }catch(err){showErr('Error: '+err.message);setLoad(false);}
});
</script>
</body>
</html>
